<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>การจัดการค่าน้ำค่าไฟ ค่าห้องสำหรับ ห้องเช่า-ส่วนตัว</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d5a82">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#17324a;--mut:#6b7f92;--line:#e3e9f0;--navy:#1d5a82;--cyan:#13a8d8;--yel:#ffb400;--red:#ee4266;--grn:#1fa971;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a25;--card:#172635;--ink:#e8f0f7;--mut:#93a8bb;--line:#243749;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a25;--card:#172635;--ink:#e8f0f7;--mut:#93a8bb;--line:#243749;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:10px;margin-right:auto}
.me img{width:48px;height:48px;border-radius:50%;object-fit:cover;padding:2px;background:conic-gradient(var(--yel),var(--red),var(--cyan),var(--yel))}
.me b{display:block;font-size:16px;line-height:1.2}.me small{color:var(--mut);font-size:12px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,.btn{font:inherit;font-size:14px;border:2px solid var(--c,var(--navy));color:var(--c,var(--navy));background:transparent;border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:500}
nav button.on,.btn.fill{background:var(--c,var(--navy));color:#fff}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
main{max-width:1060px;margin:0 auto;padding:18px 16px 60px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar h2{margin:0 auto 0 0;font-size:22px}
.mn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.mn button{border:0;background:var(--bg);color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px}
.mn span{min-width:96px;text-align:center;font-weight:600;font-size:14px}
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:22px;margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--yel);opacity:.9}
.hero::before{content:"";position:absolute;right:60px;top:70px;width:70px;height:70px;border-radius:50%;background:var(--red)}
.hero p{margin:0;opacity:.85;font-size:14px;position:relative}
.hero .big{font-size:clamp(40px,9vw,64px);font-weight:700;line-height:1.1;position:relative}
.hero .big small{font-size:20px;font-weight:500;margin-left:6px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:14px 0 10px;background:rgba(255,255,255,.2);position:relative;max-width:620px}
.legend{display:flex;gap:10px 18px;flex-wrap:wrap;font-size:13px;position:relative}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.legend b{font-weight:600}
h3{font-size:17px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.top{display:flex;align-items:center;gap:5px;padding:9px 12px;background:var(--c);color:#fff}
.top i{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.85}.top i:nth-child(2){opacity:.55}.top i:nth-child(3){opacity:.3}
.top b{margin-left:6px;font-size:15px}.top span{margin-left:auto;font-size:13px;opacity:.9}
.cb{padding:14px}
.tot{font-size:30px;font-weight:700;line-height:1.1}.tot small{font-size:14px;color:var(--mut);font-weight:400}
.row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-top:1px dashed var(--line)}
.row:first-of-type{margin-top:8px}.row span:first-child{color:var(--mut)}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;font-weight:600}
.paid{background:#d9f5e8;color:#127a50}.due{background:#ffe3e9;color:#c42a4b}.pend{background:#eef2f6;color:var(--mut)}
.pc{font-size:12px;font-weight:600;margin-left:6px}.up{color:var(--red)}.dn{color:var(--grn)}
.hero .pc{background:#fff;border-radius:99px;padding:0 8px}
.in{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.in label{font-size:12px;color:var(--mut);display:block}
.in input{width:100%;font:inherit;font-size:18px;font-weight:600;padding:7px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.in .w input:focus{border-color:var(--cyan)}.in .e input:focus{border-color:var(--yel)}
.lk .lv{font-size:18px;font-weight:600;padding:7px 10px;border:2px solid var(--line);border-radius:10px;background:var(--line);color:var(--mut);cursor:not-allowed}
.chip.warn{background:#fff1cc;color:#8a5d00}
.btn[disabled],input:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px}
.acts .btn{padding:2px 10px;font-size:12px}
.acts label{margin-right:auto;display:flex;gap:6px;align-items:center;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.tile{border-radius:14px;padding:14px;color:#fff}.tile b{font-size:26px;display:block}
.empty{padding:30px;text-align:center;color:var(--mut)}
dialog{border:0;border-radius:18px;padding:20px;width:min(380px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,30,50,.5)}
dialog label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
dialog input,dialog select{width:100%;font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
[hidden]{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lg{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 18px 26px;width:min(460px,100%);text-align:center;overflow:hidden}
.lg .cv{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:14px;padding:0;background:none;box-shadow:0 8px 24px rgba(10,30,50,.25)}
.lg img{width:88px;height:88px;border-radius:50%;object-fit:cover;padding:3px;background:conic-gradient(var(--yel),var(--red),var(--cyan),var(--yel))}
.lg h1{font-size:20px;margin:16px 0 2px}.lg p{margin:0;color:var(--mut);font-size:14px}
.lg input{width:100%;font:inherit;font-size:24px;text-align:center;letter-spacing:.3em;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:16px 0 10px}
.lg .btn{width:100%;padding:10px;font-size:16px}
#lerr{color:var(--red);min-height:24px;font-size:14px;margin-top:8px}
</style></head><body>

const sum=(ps,m,k)=>ps.reduce((a,p)=>a+(B(p,m)[k]||0),0);
const tabs=[['home','หน้าแรก','#13a8d8'],['rental','ห้องเช่า','#ffb400'],['personal','บ้านส่วนตัว','#ee4266'],['chart','กราฟสรุป','#1d5a82']];
function go(v){view=v;draw()}
function nav(){const N=$('#nav'),out=`<button style="--c:#6b7f92" onclick="logout()">ออกจากระบบ</button>`;

 if(S.mom){N.innerHTML=`<button style="--c:#6b7f92" class="on" onclick="S.mom=false;draw()">ออกจากโหมดแม่</button>`+out;return}
 N.innerHTML=tabs.map(t=>`<button style="--c:${t[2]}" class="${view===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')+
 `<button style="--c:#6b7f92" onclick="S.mom=true;view='home';draw()">ดูแบบโหมดแม่</button><button style="--c:#6b7f92" onclick="$('#imp').showModal()">นำเข้าข้อมูลเก่า</button>`+out}
function mbar(title,extra=''){return`<div class="bar"><h2>${title}</h2>${extra}<div class="mn"><button aria-label="เดือนก่อน" onclick="S.month=sh(S.month,-1);draw()">‹</button><span>${ml(S.month)}</span><button aria-label="เดือนถัดไป" onclick="S.month=sh(S.month,1);draw()">›</button></div></div>`}
function status(p,m){const b=B(p,m);if(!has(p,m))return'<span class="chip pend">รอกรอกค่าน้ำค่าไฟ</span>';return b.paid?'<span class="chip paid">จ่ายแล้ว</span>':'<span class="chip due">ยังไม่จ่าย</span>'}
function hcard(p,col){const m=S.month,b=B(p,m);return`<div class="card" style="--c:${col}"><div class="top"><i></i><i></i><i></i><b>${p.name}</b><span>${p.no||''}</span></div><div class="cb">
 <div class="tot">${f(tot(p,m))} <small>บาท</small></div>${status(p,m)}
 <div class="row"><span>ค่าน้ำ</span><span>${b.w!=null?f(b.w):'–'}</span></div><div class="row"><span>ค่าไฟ</span><span>${b.e!=null?f(b.e):'–'}</span></div>
 ${p.rent?`<div class="row"><span>ค่าห้อง</span><span>${f(p.rent)}</span></div>`:''}${p.trash?`<div class="row"><span>ค่าขยะ</span><span>${f(p.trash)}</span></div>`:''}</div></div>`}
function home(){const m=S.month,pm=sh(m,-1),ps=S.props;
 const W=sum(ps,m,'w'),E=sum(ps,m,'e'),R=ps.reduce((a,p)=>a+p.rent,0),K=ps.reduce((a,p)=>a+p.trash,0),T=W+E+R+K;
 const sg=(v,c)=>T?`<div style="width:${v/T*100}%;background:${c}"></div>`:'';
 const rs=ps.filter(p=>p.type==='rental'),pr=ps.filter(p=>p.type!=='rental');
 return mbar('สรุปเดือนนี้')+`<div class="hero"><p>ยอดรวมที่ต้องจ่ายและเก็บทั้งหมด</p><div class="big">${f(T)}<small>บาท</small></div>
 <div class="stack">${sg(W,C.w)}${sg(E,C.e)}${sg(R,C.r)}${sg(K,C.k)}</div>
 <div class="legend"><span><i style="background:${C.w}"></i>ค่าน้ำ <b>${f(W)}</b>${pc(W,sum(ps,pm,'w'))}</span><span><i style="background:${C.e}"></i>ค่าไฟ <b>${f(E)}</b>${pc(E,sum(ps,pm,'e'))}</span><span><i style="background:${C.r}"></i>ค่าห้อง <b>${f(R)}</b></span><span><i style="background:${C.k}"></i>ค่าขยะ <b>${f(K)}</b></span></div></div>`+
 `<h3 style="--c:#ffb400">ห้องเช่า</h3><div class="grid">${rs.map(p=>hcard(p,'#ffb400')).join('')||'<div class="empty">ยังไม่มีห้องเช่า</div>'}</div>`+
 `<h3 style="--c:#ee4266">บ้านส่วนตัว</h3><div class="grid">${pr.map(p=>hcard(p,'#ee4266')).join('')||'<div class="empty">ยังไม่มีบ้านส่วนตัว</div>'}</div>`}
function group(type){const m=S.month,pm=sh(m,-1),ps=S.props.filter(p=>(p.type==='rental')===(type==='rental')),col=type==='rental'?'#ffb400':'#ee4266';
 return mbar(type==='rental'?'ห้องเช่า':'บ้านส่วนตัว',`<button class="btn fill" style="--c:${col};color:#17324a" onclick="openP(null,'${type}')">+ เพิ่ม${type==='rental'?'ห้อง':'บ้าน'}</button>`)+
 `<div class="grid">${ps.map(p=>{const b=B(p,m),q=B(p,pm);return`<div class="card" style="--c:${col}"><div class="top"><i></i><i></i><i></i><b>${p.name}</b><span>${p.no||''}</span></div><div class="cb">
 <div class="tot"><span id="t${p.id}">${f(tot(p,m))}</span> <small>บาท</small> ${b.saved?'<span class="chip paid">✓ บันทึกแล้ว</span>':'<span class="chip warn">ยังไม่บันทึก</span>'}</div>
 ${inputs(p,b,q)}
 <div class="row"><span>ค่าห้อง</span><span>${f(p.rent)}</span></div><div class="row"><span>ค่าขยะ</span><span>${f(p.trash)}</span></div>
 <div class="acts"><label><input type="checkbox" ${b.paid?'checked':''} ${b.saved?'':'disabled'} onchange="setB('${p.id}','paid',this.checked)">จ่ายแล้ว</label><button class="btn" onclick="openP('${p.id}')">แก้ไข</button><button class="btn" style="--c:var(--red)" onclick="delP('${p.id}')">ลบ</button></div></div></div>`}).join('')||'<div class="empty">กดปุ่มเพิ่มเพื่อเริ่มต้น</div>'}</div>
 <p style="color:var(--mut);font-size:13px">ช่องจางๆ คือยอดเดือนก่อน กรอกแล้วกด “บันทึก” ช่องจะเป็นสีเทาและล็อกไว้ ถ้าคีย์ผิดกด ✎ เพื่อแก้ไข</p>`}
function inputs(p,b,q){if(b.saved)return`<div class="in lk"><div><label>ค่าน้ำ (บาท)</label><div class="lv">${f(b.w)}</div></div><div><label>ค่าไฟ (บาท)</label><div class="lv">${f(b.e)}</div></div></div><button class="btn" style="--c:#6b7f92;width:100%" onclick="unlock('${p.id}')">✎ แก้ไขค่าน้ำค่าไฟ</button>`;
 return`<div class="in"><div class="w"><label>ค่าน้ำ (บาท)</label><input type="number" min="0" inputmode="decimal" value="${b.w??''}" placeholder="${q.w??0}" oninput="setB('${p.id}','w',this.value)"></div><div class="e"><label>ค่าไฟ (บาท)</label><input type="number" min="0" inputmode="decimal" value="${b.e??''}" placeholder="${q.e??0}" oninput="setB('${p.id}','e',this.value)"></div></div><button class="btn fill" style="--c:#1fa971;width:100%" onclick="saveB('${p.id}')">บันทึก</button>`}
async function sync(id){const b=S.bills[id+'|'+S.month]||{};
 const {error}=await sb.from('bills').upsert({prop_id:id,month:S.month,water:b.w??null,elec:b.e??null,paid:!!b.paid,saved:!!b.saved},{onConflict:'prop_id,month'});
 if(error)alert('บันทึกไม่สำเร็จ: '+error.message);return !error}
async function saveB(id){const k=id+'|'+S.month,b=S.bills[k]||{};if(b.w==null&&b.e==null){alert('กรอกค่าน้ำหรือค่าไฟก่อนกดบันทึก');return}
 b.w=b.w||0;b.e=b.e||0;b.saved=true;S.bills[k]=b;if(await sync(id))draw();else b.saved=false}
async function unlock(id){const b=S.bills[id+'|'+S.month];if(!b)return;b.saved=false;if(await sync(id))draw();else b.saved=true}
async function setB(id,k,v){const key=id+'|'+S.month,b=S.bills[key]=S.bills[key]||{};
 if(k==='paid'){b.paid=v;if(!await sync(id)){b.paid=!v;draw()}}else if(v==='')delete b[k];else b[k]=Math.max(0,+v);
 const p=S.props.find(x=>x.id===id);$('#t'+id)&&($('#t'+id).textContent=f(tot(p,S.month)))}
function openP(id,type){edit=id;const p=S.props.find(x=>x.id===id)||{name:'',no:'',type:type||'rental',rent:type==='personal'?0:1500,trash:type==='personal'?0:20};
 $('#dt').textContent=id?'แก้ไขข้อมูล':'เพิ่มรายการใหม่';$('#fn').value=p.name;$('#fno').value=p.no;$('#ft').value=p.type;$('#fr').value=p.rent;$('#fk').value=p.trash;dg.showModal()}
async function saveP(){const d={name:$('#fn').value.trim()||'ไม่มีชื่อ',no:$('#fno').value.trim(),type:$('#ft').value,rent:+$('#fr').value||0,trash:+$('#fk').value||0};
 const old=S.props.find(x=>x.id===edit),row={id:edit||'x'+Date.now(),...d,sort:old?old.sort:S.props.length};
 const {error}=await sb.from('properties').upsert(row);if(error){alert('บันทึกไม่สำเร็จ: '+error.message);return}
 if(old)Object.assign(old,row);else S.props.push(row);dg.close();draw()}
async function delP(id){const p=S.props.find(x=>x.id===id);if(!confirm('ลบ '+p.name+' และประวัติทั้งหมด?'))return;
 const {error}=await sb.from('properties').delete().eq('id',id);if(error){alert('ลบไม่สำเร็จ: '+error.message);return}
 S.props=S.props.filter(x=>x.id!==id);Object.keys(S.bills).forEach(k=>{if(k.startsWith(id+'|'))delete S.bills[k]});draw()}
function chart(){const ps=sel==='all'?S.props:S.props.filter(p=>p.id===sel),ms=[-5,-4,-3,-2,-1,0].map(d=>sh(S.month,d));
 const W=ms.map(m=>sum(ps,m,'w')),E=ms.map(m=>sum(ps,m,'e')),mx=Math.max(1,...W,...E),h=190,bw=22;
 let g='';ms.forEach((m,i)=>{const x=40+i*98;[[W[i],C.w,0],[E[i],C.e,1]].forEach(([v,c,j])=>{const bh=v/mx*h;g+=`<rect x="${x+j*(bw+4)}" y="${215-bh}" width="${bw}" height="${bh}" rx="5" fill="${c}"/><text x="${x+j*(bw+4)+bw/2}" y="${209-bh}" font-size="10" text-anchor="middle" fill="currentColor">${v?f(v):''}</text>`});g+=`<text x="${x+bw+2}" y="236" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">${ml(m)}</text>`});
 const l=ms.length-1,tile=(t,a,b,c)=>`<div class="tile" style="background:${c}"><small>${t}</small><b>${f(a)} บาท</b><span style="background:#fff;color:#17324a;border-radius:99px;padding:0 10px;font-size:13px;font-weight:600">${pct(a,b)===null?'ยังไม่มีเดือนก่อนเทียบ':(pct(a,b)>=0?'▲ เพิ่ม ':'▼ ลด ')+Math.abs(pct(a,b)).toFixed(1)+'% จาก '+f(b)}</span></div>`;
 return mbar('กราฟสรุป')+`<div class="chips">${[['all','ทุกหลัง'],...S.props.map(p=>[p.id,p.name+(p.no?' '+p.no:'')])].map(([i,n])=>`<button class="btn ${sel===i?'fill':''}" style="--c:#1d5a82" onclick="sel='${i}';draw()">${n}</button>`).join('')}</div>
 <div class="tiles">${tile('ค่าน้ำเดือนนี้',W[l],W[l-1],'#13a8d8')}${tile('ค่าไฟเดือนนี้',E[l],E[l-1],'#e29a00')}</div>
 <div class="panel"><svg viewBox="0 0 640 245" style="width:100%;min-width:520px" role="img" aria-label="กราฟค่าน้ำและค่าไฟ 6 เดือน">${g}</svg>
 <div class="legend" style="color:var(--ink)"><span><i style="background:${C.w}"></i>ค่าน้ำ</span><span><i style="background:${C.e}"></i>ค่าไฟ</span></div></div>
 <div class="panel"><table><tr><th>เดือน</th><th>ค่าน้ำ</th><th>เปลี่ยนแปลง</th><th>ค่าไฟ</th><th>เปลี่ยนแปลง</th></tr>${ms.map((m,i)=>`<tr><td>${ml(m)}</td><td>${f(W[i])}</td><td>${i?pc(W[i],W[i-1])||'–':'–'}</td><td>${f(E[i])}</td><td>${i?pc(E[i],E[i-1])||'–':'–'}</td></tr>`).join('')}</table></div>`}
function draw(){nav();const mom=S.mom||role!=='editor';$('#m').innerHTML=mom||view==='home'?home():view==='chart'?chart():group(view)}
function showLogin(msg){role=null;$('#hd').hidden=true;$('#m').innerHTML='';const L=$('#login');L.hidden=false;
 L.innerHTML=`<div class="lg"><img class="cv" src="${COVER}" alt="ห้องเช่า ค่าห้อง 1,500 บาทต่อเดือน"><h1>การจัดการค่าน้ำค่าไฟ ค่าห้องสำหรับ ห้องเช่า-ส่วนตัว</h1><p>ใส่รหัสเพื่อเข้าใช้งาน</p>
 <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" aria-label="รหัส PIN" onkeydown="if(event.key==='Enter')login()">
 <button class="btn fill" onclick="login()">เข้าสู่ระบบ</button><div id="lerr">${msg||''}</div></div>`;$('#pin').focus()}
async function login(){const pin=$('#pin').value.trim();if(!pin)return;$('#lerr').textContent='กำลังตรวจสอบ...';
 for(const em of[EDITOR_EMAIL,VIEWER_EMAIL]){const {error}=await sb.auth.signInWithPassword({email:em,password:PW_PREFIX+pin});if(!error){await enter(em);return}}
 $('#lerr').textContent='รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง';$('#pin').value='';$('#pin').focus()}
async function logout(){clearInterval(window.tm);await sb.auth.signOut();S.props=[];S.bills={};S.mom=false;view='home';showLogin()}
async function enter(email){role=email===EDITOR_EMAIL?'editor':'viewer';$('#login').hidden=true;$('#hd').hidden=false;
 if(await load())draw();clearInterval(window.tm);
 if(role==='viewer')window.tm=setInterval(async()=>{if(await load())draw()},60000)}
async function load(){const a=await sb.from('properties').select('*').order('sort'),b=await sb.from('bills').select('*');
 if(a.error||b.error){alert('โหลดข้อมูลไม่สำเร็จ: '+(a.error||b.error).message);return false}
 S.props=a.data.map(r=>({id:r.id,name:r.name,no:r.no||'',type:r.type,rent:r.rent,trash:r.trash,sort:r.sort}));
 S.bills={};b.data.forEach(r=>{S.bills[r.prop_id+'|'+r.month]={w:r.water==null?undefined:+r.water,e:r.elec==null?undefined:+r.elec,paid:r.paid,saved:r.saved}});
 if(!S.props.length&&role==='editor'){const rows=seed().props.map((p,i)=>({...p,sort:i})),r=await sb.from('properties').upsert(rows);if(!r.error)S.props=rows}
 return true}
async function doImp(){let o;try{o=JSON.parse($('#impt').value)}catch(e){alert('ข้อมูลไม่ใช่รูปแบบที่ถูกต้อง');return}
 if(!o.props){alert('ไม่พบรายการบ้านหรือห้องในข้อมูลนี้');return}
 const ps=o.props.map((p,i)=>({id:p.id,name:p.name,no:p.no||'',type:p.type,rent:p.rent||0,trash:p.trash||0,sort:i}));
 let r=await sb.from('properties').upsert(ps);if(r.error){alert(r.error.message);return}
 const bs=Object.entries(o.bills||{}).map(([k,b])=>{const [pid,m]=k.split('|');return{prop_id:pid,month:m,water:b.w??null,elec:b.e??null,paid:!!b.paid,saved:b.saved??(b.w!=null||b.e!=null)}}).filter(x=>ps.some(p=>p.id===x.prop_id));
 if(bs.length){r=await sb.from('bills').upsert(bs,{onConflict:'prop_id,month'});if(r.error){alert(r.error.message);return}}
 $('#imp').close();await load();draw();alert('นำเข้าข้อมูลแล้ว')}
async function init(){if(!window.supabase||SB_URL.startsWith('YOUR-')){showLogin('ยังไม่ได้ตั้งค่า Supabase ในไฟล์ (SB_URL และ SB_KEY)');return}
 sb=supabase.createClient(SB_URL,SB_KEY);const {data}=await sb.auth.getSession();
 if(data.session)await enter(data.session.user.email);else showLogin()}
init();
</script></body></html>
